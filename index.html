<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Online dengan Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 130vh;
            margin: 0;
        }
        
        .quiz-container {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 800px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .question {
            margin-bottom: 20px;
        }

        .question h3 {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .options label {
            font-size: 1rem;
            display: flex;
            align-items: center;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .options input {
            margin-right: 10px;
            cursor: pointer;
        }

        .options label:hover {
            background: #e2e2e2;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            color: #fff;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 30px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .timer {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #d9534f;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h1>Ujian Online dengan Timer</h1>
        <div id="timer" class="timer">Waktu Tersisa: 10:00</div>
        <div id="quiz">
            <!-- Pertanyaan dan pilihan akan diisi di sini menggunakan JavaScript -->
        </div>
        <button onclick="submitQuiz()">Kirim Jawaban</button>
        <div id="result" class="result"></div>
    </div>

    <script>
        const QUESTIONS = [
            {
                question: "Apa ibu kota Indonesia?",
                options: ["Jakarta", "Bandung", "Yogyakarta", "Surabaya"],
                correctAnswer: 0
            },
            {
                question: "Siapa Presiden pertama Indonesia?",
                options: ["Soekarno", "Soeharto", "BJ Habibie", "Jokowi"],
                correctAnswer: 0
            },
            {
                question: "Berapa jumlah provinsi di Indonesia?",
                options: ["30", "34", "32", "36"],
                correctAnswer: 1
            }
        ];

        // Class untuk mengelola pertanyaan dan jawaban
        class Quiz {
            constructor(questions) {
                this.questions = questions;
                this.userAnswers = [];
            }

            renderQuestions() {
                const quizDiv = document.getElementById("quiz");
                quizDiv.innerHTML = ''; // Clear any existing questions
                this.questions.forEach((q, index) => {
                    const questionDiv = document.createElement("div");
                    questionDiv.classList.add("question");

                    // Create question text
                    const questionText = document.createElement("h3");
                    questionText.innerText = `${index + 1}. ${q.question}`;
                    questionDiv.appendChild(questionText);

                    // Create options
                    const optionsDiv = document.createElement("div");
                    optionsDiv.classList.add("options");

                    q.options.forEach((option, i) => {
                        const optionLabel = document.createElement("label");
                        const optionInput = document.createElement("input");
                        optionInput.type = "radio";
                        optionInput.name = `question-${index}`;
                        optionInput.value = i;
                        optionLabel.appendChild(optionInput);
                        optionLabel.appendChild(document.createTextNode(option));
                        optionsDiv.appendChild(optionLabel);
                    });

                    questionDiv.appendChild(optionsDiv);
                    quizDiv.appendChild(questionDiv);
                });
            }

            submitAnswers() {
                let score = 0;
                this.questions.forEach((q, index) => {
                    const selectedOption = document.querySelector(`input[name="question-${index}"]:checked`);
                    if (selectedOption && parseInt(selectedOption.value) === q.correctAnswer) {
                        score++;
                    }
                });
                return score;
            }
        }

        // Class anak (subclass) untuk menambahkan fitur timer
        class TimedQuiz extends Quiz {
            constructor(questions, timeLimit) {
                super(questions); // Menggunakan konstruktor dari class parent (Quiz)
                this.timeLimit = timeLimit;
                this.timeRemaining = timeLimit;
                this.timerInterval = null;
            }

            // Fungsi untuk memulai timer
            startTimer() {
                this.timerInterval = setInterval(() => {
                    if (this.timeRemaining > 0) {
                        this.timeRemaining--;
                        const minutes = Math.floor(this.timeRemaining / 60);
                        const seconds = this.timeRemaining % 60;
                        document.getElementById("timer").innerText = `Waktu Tersisa: ${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
                    } else {
                        clearInterval(this.timerInterval);
                        this.submitQuiz();
                    }
                }, 1000);
            }

            submitQuiz() {
                const score = this.submitAnswers();
                const totalQuestions = QUESTIONS.length;
                const resultDiv = document.getElementById("result");

                let resultMessage = `Anda menjawab ${score} dari ${totalQuestions} pertanyaan dengan benar.`;
                if (score === totalQuestions) {
                    resultMessage += " Selamat, Anda sempurna!";
                } else if (score >= totalQuestions / 2) {
                    resultMessage += " Bagus, Anda lulus!";
                } else {
                    resultMessage += " Cobalah lagi, Anda belum lulus.";
                }

                resultDiv.innerText = resultMessage;
                document.getElementById("timer").innerText = "Waktu Habis!";
                document.querySelector("button").disabled = true; // Disable the submit button
            }
        }

        // Inisialisasi ujian dengan timer 10 menit
        const timedQuiz = new TimedQuiz(QUESTIONS, 10 * 60); // 10 menit
        timedQuiz.renderQuestions();
        timedQuiz.startTimer();

        // Fungsi untuk submit quiz
        function submitQuiz() {
            timedQuiz.submitQuiz();
        }
    </script>

</body>
</html>
